# =============================================================================
# Il "robot" che tiene aggiornata la app.
#
# Gira sui computer di GitHub (gratis), anche a PC spento:
#   - rilegge il sito degli interpelli
#   - ricalcola i tempi di viaggio delle scuole nuove
#   - salva i dati aggiornati e li pubblica
#   - ti manda la notifica Telegram se c'e' qualcosa di nuovo
#
# NOTA IMPORTANTE sul "ogni 30 minuti": GitHub mette in coda i lavori
# programmati gratuiti e li fa partire quando ha risorse libere. Nella pratica
# passavano 2-5 ore fra un giro e l'altro. Per questo ogni esecuzione, invece
# di controllare una volta sola, ripete il controllo piu' volte al suo interno
# aspettando qualche minuto fra l'uno e l'altro (vedi GIRI e PAUSA).
#
# Puoi anche lanciarlo a mano: scheda "Actions" -> "Aggiorna interpelli" ->
# "Run workflow". In quel caso fa un solo controllo, cosi' risponde subito.
# =============================================================================

name: Aggiorna interpelli

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:        # il bottone "Run workflow" a mano
    inputs:
      prova_notifica:
        description: "Manda anche un messaggio di prova su Telegram/email"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "docs/data/ricerche.json"   # hai cambiato le ricerche: ricontrolliamo subito

permissions:
  contents: write

# Se un giro automatico e' ancora in corso, il successivo aspetta il suo turno.
# Quelli lanciati a mano (dal bottone della app) hanno una fila tutta loro:
# altrimenti aspetterebbero fino a 40 minuti la fine del giro automatico.
# Se due giri salvano insieme, ci pensa la funzione "salva" qui sotto.
concurrency:
  group: aggiorna-interpelli-${{ github.event_name == 'workflow_dispatch' && 'mano' || 'auto' }}
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Preparo git per i salvataggi
        run: |
          git config user.name "Robot Interpelli"
          git config user.email "actions@github.com"

      - name: Controlla, aggiorna e notifica
        env:
          CASA_INDIRIZZO: ${{ secrets.CASA_INDIRIZZO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_UTENTE: ${{ secrets.EMAIL_UTENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          URL_APP: ${{ vars.URL_APP }}
          # A mano: un solo controllo (vuoi vedere subito il risultato).
          # In automatico: 5 controlli a 10 minuti di distanza, cioe' circa
          # 40 minuti di sorveglianza continua a ogni esecuzione.
          GIRI: ${{ github.event_name == 'workflow_dispatch' && '1' || '5' }}
          PAUSA: "600"
        run: |
          # Salva e pubblica. Se nel frattempo un altro giro (o tu) ha gia'
          # salvato e i file si scontrano, non proviamo a "fondere" i dati:
          # ripartiamo dalla versione appena pubblicata e rifacciamo il
          # controllo sopra quella (senza rimandare le notifiche, e tenendo
          # in memoria quelle gia' mandate da questo giro).
          salva() {
            git add -A docs/data data
            if git diff --staged --quiet; then
              echo "niente di nuovo da salvare"
              return 0
            fi
            git commit -q -m "Aggiornamento interpelli $(date -u '+%Y-%m-%d %H:%M UTC')"
            for tentativo in 1 2 3; do
              if git pull --rebase -q && git push -q; then
                echo "salvato e pubblicato"
                return 0
              fi
              echo "scontro con un altro salvataggio: rifaccio sopra la versione pubblicata"
              git rebase --abort 2>/dev/null || true
              cp data/gia_notificati.json /tmp/notificati_miei.json 2>/dev/null || true
              git fetch -q origin main
              git reset -q --hard origin/main
              python scripts/build.py --no-notifica
              if [ -f /tmp/notificati_miei.json ] && [ -f data/gia_notificati.json ]; then
                python -c "import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); a.update(b); json.dump(a, open(sys.argv[2],'w'), indent=1, ensure_ascii=False)" /tmp/notificati_miei.json data/gia_notificati.json
              fi
              git add -A docs/data data
              git diff --staged --quiet || git commit -q -m "Aggiornamento interpelli $(date -u '+%Y-%m-%d %H:%M UTC')"
            done
            echo "push non riuscito: riprovo al prossimo controllo"
          }

          for giro in $(seq 1 "$GIRI"); do
            echo "::group::Controllo $giro di $GIRI"
            python scripts/build.py

            # Salviamo dopo OGNI controllo: cosi' la app si aggiorna subito,
            # senza aspettare la fine di tutta l'esecuzione.
            salva
            echo "::endgroup::"

            if [ "$giro" -lt "$GIRI" ]; then
              echo "aspetto $PAUSA secondi prima del prossimo controllo"
              sleep "$PAUSA"
            fi
          done

      - name: Messaggio di prova (solo se lo hai chiesto)
        if: inputs.prova_notifica
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_UTENTE: ${{ secrets.EMAIL_UTENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python scripts/notify.py --prova
